# XcodeGen spec. Single-writer file (orchestrator). Run `make gen` after editing.
name: Lightwell

options:
  bundleIdPrefix: com.alexluncan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Kit:
    path: Packages/Kit

targets:
  Lightwell:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Kit
        products: [AppCore, ScanKit, RulesKit, CleanupKit, IPCProtocol, AIBridge, VizKit]
      - target: LightwellMCP
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Lightwell
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
          # No com.apple.security.get-task-allow in Release: the app holds Full Disk Access.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  LightwellMCP:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/MCPHelper
    dependencies:
      - package: Kit
        products: [MCPServerKit]
    settings:
      base:
        PRODUCT_NAME: lightwell-mcp
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).mcp
        # Embedded Info.plist makes the signing identifier the bundle id (IPC peer check, PLAN 3.6).
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: Config/Helper.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          # No com.apple.security.get-task-allow in Release (the helper talks to the trusted IPC socket).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  LightwellUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Lightwell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Lightwell

schemes:
  Lightwell:
    build:
      targets:
        Lightwell: all
        LightwellMCP: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LightwellUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
