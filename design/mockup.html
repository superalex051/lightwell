<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightwell: three design directions</title>
<style>
/* ---------- Apple system faces (Safari resolves ui-* keywords, Chromium uses the local files) ---------- */
@font-face{font-family:"LW Rounded";src:local("SF Pro Rounded"),local(".SF NS Rounded"),url("file:///System/Library/Fonts/SFNSRounded.ttf");font-weight:100 900}
@font-face{font-family:"LW Serif";src:local("New York"),local(".New York"),url("file:///System/Library/Fonts/NewYork.ttf");font-weight:100 900}
@font-face{font-family:"LW Serif";font-style:italic;src:local("New York Italic"),url("file:///System/Library/Fonts/NewYorkItalic.ttf");font-weight:100 900}
@font-face{font-family:"LW Mono";src:local("SF Mono"),local(".SF NS Mono"),url("file:///System/Library/Fonts/SFNSMono.ttf");font-weight:100 900}

:root{
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --f-round: ui-rounded, "LW Rounded", -apple-system, system-ui, sans-serif;
  --f-serif: ui-serif, "LW Serif", "Iowan Old Style", Charter, Georgia, serif;
  --f-mono: ui-monospace, "LW Mono", "SF Mono", Menlo, monospace;
  --ease-out: cubic-bezier(.23,1,.32,1);
  --ease-io: cubic-bezier(.77,0,.175,1);
  --page:#ECEBE7; --page-ink:#1C1C1A; --page-ink2:#6A6863; --page-hair:rgba(28,28,26,.1); --page-chip:#FFFFFF;
}
body.dark{ --page:#0F1011; --page-ink:#ECEAE5; --page-ink2:#8E8B85; --page-hair:rgba(236,234,229,.1); --page-chip:#1B1C1E; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--page-ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- presentation shell ---------- */
.deck{max-width:1320px;margin:0 auto;padding:22px 32px 40px}
.deck-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-round);font-size:17px;font-weight:650;letter-spacing:-.01em}
.brand span{color:var(--page-ink2);font-size:12px}
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--page-hair)}
.tab{padding:6px 14px;border-radius:9px;font-weight:550;color:var(--page-ink2);transition:background-color .18s ease,color .18s ease}
.tab[aria-pressed=true]{background:var(--page-chip);color:var(--page-ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab small{font-weight:450;opacity:.6;margin-right:6px}
.toggles{justify-self:end;display:flex;gap:8px}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--page-hair)}
.seg button{padding:4px 10px;border-radius:7px;font-size:12px;color:var(--page-ink2);font-weight:550}
.seg button[aria-pressed=true]{background:var(--page-chip);color:var(--page-ink)}
.dirdesc{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:baseline;margin:18px 4px 14px;max-width:1000px}
.dirdesc h2{font-size:22px;font-weight:650;letter-spacing:-.02em}
.dirdesc p{color:var(--page-ink2);line-height:1.5;max-width:82ch}
.stage-wrap{display:flex;justify-content:center}
.stage{width:1256px;height:812px;border-radius:20px;position:relative;overflow:hidden;display:grid;place-items:center;transition:background .3s ease}
.jump{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.jump button{padding:5px 11px;border-radius:999px;border:1px solid var(--page-hair);color:var(--page-ink2);font-size:12px}
.jump button[aria-pressed=true]{color:var(--page-ink);background:var(--page-chip)}
.jump kbd{font-family:var(--f-mono);font-size:10px;opacity:.6;margin-right:5px}
.deck-foot{margin:26px 4px 0;padding-top:16px;border-top:1px solid var(--page-hair);display:flex;justify-content:space-between;gap:24px;color:var(--page-ink2);font-size:12px;line-height:1.5}
.deck-foot b{color:var(--page-ink);font-weight:600}

/* ---------- window chrome shared ---------- */
.win{width:1200px;height:760px;border-radius:26px;position:relative;overflow:hidden;color:var(--ink);background:var(--win);
  box-shadow:0 40px 90px -30px var(--shadow),0 12px 30px -12px var(--shadow),0 0 0 .5px var(--edge);font-family:var(--f-ui)}
.lights{position:absolute;top:19px;left:21px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.side{position:absolute;left:8px;top:8px;bottom:8px;border-radius:19px;background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:inset 0 .5px 0 var(--spec),inset 0 0 0 .5px var(--glass-edge),0 10px 30px -18px var(--shadow);z-index:3;display:flex;flex-direction:column}
.main{position:absolute;top:0;bottom:0;right:0;display:flex;flex-direction:column}
.tb{height:54px;display:flex;align-items:center;gap:8px;padding:0 14px;flex:none;position:relative;z-index:2}
.cap{height:32px;min-width:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;background:var(--cap);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  box-shadow:inset 0 .5px 0 var(--spec),0 0 0 .5px var(--hair2),0 3px 10px -4px var(--shadow);color:var(--ink);font-weight:520;font-size:13px;
  transition:transform .16s var(--ease-out),background-color .18s ease}
.cap:active,.btn:active,.chip-btn:active{transform:scale(.97)}
.cap-group{display:inline-flex;border-radius:16px;background:var(--cap);box-shadow:inset 0 .5px 0 var(--spec),0 0 0 .5px var(--hair2),0 3px 10px -4px var(--shadow)}
.cap-group .cap{background:none;box-shadow:none}
.cap .ico{width:16px;height:16px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;overflow:auto;position:relative}
.content::-webkit-scrollbar{width:0}
.screen{animation:scr .26s var(--ease-out) both}
@keyframes scr{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{height:32px;padding:0 15px;border-radius:16px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;transition:transform .16s var(--ease-out),background-color .18s ease,opacity .18s ease;white-space:nowrap}
.btn .ico{width:15px;height:15px}
.btn-pri{background:var(--accent);color:var(--accent-ink)}
.btn-sec{background:var(--fill);color:var(--ink)}
.btn-ghost{color:var(--ink2)}
.btn[disabled]{opacity:.4;pointer-events:none}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:-.01em}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.risk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap}
.risk .ico{width:12px;height:12px;stroke-width:2}
.r-safe{color:var(--safe);background:color-mix(in oklch,var(--safe) 13%,transparent)}
.r-review{color:var(--review);background:color-mix(in oklch,var(--review) 14%,transparent)}
.r-keep,.r-locked{color:var(--keep);background:color-mix(in oklch,var(--keep) 14%,transparent)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.check{width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.2px var(--ink3);transition:background-color .15s ease}
.check .ico{width:12px;height:12px;stroke-width:2.4;opacity:0;color:var(--accent-ink)}
.check.on{background:var(--accent);box-shadow:none}.check.on .ico{opacity:1}
.check.na{opacity:.35}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 16px;border-radius:18px;
  background:var(--toast);color:var(--toast-ink);box-shadow:0 14px 34px -12px rgba(0,0,0,.4);font-weight:520;animation:toast .3s var(--ease-out) both;white-space:nowrap}
.toast button{padding:5px 12px;border-radius:12px;background:color-mix(in oklch,var(--toast-ink) 16%,transparent);font-weight:600}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.veil{position:absolute;inset:0;background:var(--veil);z-index:15;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:50%;top:54px;width:460px;transform:translateX(-50%);z-index:16;border-radius:22px;background:var(--sheet);padding:22px 22px 18px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.45),0 0 0 .5px var(--hair2);animation:sheet .28s var(--ease-out) both}
@keyframes sheet{from{opacity:0;transform:translate(-50%,-10px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
.sheet h3{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:8px}
.sheet p{color:var(--ink2);line-height:1.5}
.sheet .warn{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:10px 12px;border-radius:12px;background:color-mix(in oklch,var(--review) 12%,transparent);color:var(--ink);line-height:1.45}
.sheet .warn .ico{color:var(--review);margin-top:1px}
.sheet ul{list-style:none;margin:12px 0;max-height:150px;overflow:auto;border-top:1px solid var(--hair)}
.sheet li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hair);font-size:12px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#tip{position:fixed;z-index:100;pointer-events:none;padding:7px 10px;border-radius:10px;background:rgba(22,22,20,.92);color:#F4F2EC;font-size:12px;line-height:1.35;opacity:0;transition:opacity .12s ease;max-width:280px;font-family:var(--f-ui)}
#tip b{font-weight:600}#tip .mono{color:#BDB9B0;display:block;margin-top:2px}

/* tool chips + chat shared */
.tools{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.tool{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px 3px 6px;border-radius:999px;background:var(--fill);color:var(--ink2)}
.tool .ico{width:12px;height:12px}
.tool code{font-family:var(--f-mono);font-size:10.5px;color:var(--ink)}
.prop{border-radius:16px;padding:12px 14px;margin:8px 0;background:var(--raise);box-shadow:0 0 0 .5px var(--hair2),0 6px 18px -12px var(--shadow)}
.prop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.prop-h b{font-weight:620}
.prop p{color:var(--ink2);line-height:1.45;font-size:12.5px}
.prop .acts{display:flex;gap:6px;margin-top:10px;align-items:center}
.prop .done{display:inline-flex;align-items:center;gap:6px;color:var(--safe);font-weight:600;font-size:12px}
.prop.rej{background:none;box-shadow:inset 0 0 0 1px var(--hair2)}
.prop.rej .prop-h b{color:var(--ink2)}
.chip-btn{height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:transform .16s var(--ease-out)}
.chip-btn.pri{background:var(--accent);color:var(--accent-ink)}
.chip-btn.sec{background:var(--fill);color:var(--ink)}
.chip-btn .ico{width:13px;height:13px}
.composer{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:20px;background:var(--raise);box-shadow:0 0 0 .5px var(--hair2)}
.composer span{flex:1;color:var(--ink3)}
.composer .send{width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sugg button{font-size:11.5px;padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);color:var(--ink2)}
.ai-foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:8px}
.ai-foot .ico{width:12px;height:12px}

/* treemap shared */
.tm{position:relative}
.tm-cell{position:absolute;overflow:hidden;cursor:pointer;transition:filter .15s ease,transform .18s var(--ease-out)}
.tm-cell:hover{filter:brightness(1.05) saturate(1.1)}
.tm-sub{position:absolute;border-radius:5px}
.tm-lab{position:absolute;left:9px;top:7px;right:8px;font-size:12px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-lab small{display:block;font-weight:500;opacity:.72;font-size:11px;margin-top:1px}

/* ================= Direction A: Daylight ================= */
.dA{--win:#F7F5F0;--raise:#FFFFFF;--ink:#1D1C19;--ink2:#5E5B54;--ink3:#8E8A82;--hair:rgba(29,28,25,.08);--hair2:rgba(29,28,25,.11);--fill:rgba(29,28,25,.055);
  --glass:rgba(250,248,243,.66);--glass-edge:rgba(255,255,255,.75);--spec:rgba(255,255,255,.95);--cap:rgba(255,255,255,.7);--shadow:rgba(70,60,40,.28);--edge:rgba(0,0,0,.14);
  --accent:#1D1C19;--accent-ink:#F7F5F0;--light:#F4C95D;--safe:#2F8A57;--review:#C2621E;--keep:#6F7680;--toast:#1D1C19;--toast-ink:#F7F5F0;--veil:rgba(247,245,240,.55);--sheet:#FFFFFF;
  --c-proj:#A9C2EC;--c-dev:#93CDB8;--c-apps:#EDBE94;--c-appdata:#E9D592;--c-media:#EDA9A6;--c-caches:#BEDB95;--c-dl:#97D3E2;--c-sys:#CFCAC0;--c-other:#E3DFD7;--c-ink:#1D1C19}
body.dark .dA{--win:#1B1A18;--raise:#25241F;--ink:#F2EFE8;--ink2:#B3AEA4;--ink3:#7E796F;--hair:rgba(242,239,232,.08);--hair2:rgba(242,239,232,.12);--fill:rgba(242,239,232,.07);
  --glass:rgba(42,40,36,.6);--glass-edge:rgba(255,255,255,.1);--spec:rgba(255,255,255,.14);--cap:rgba(62,59,54,.62);--shadow:rgba(0,0,0,.6);--edge:rgba(255,255,255,.1);
  --accent:#F2EFE8;--accent-ink:#1B1A18;--light:#F2C14E;--safe:#5DBB84;--review:#E58B4B;--keep:#9AA1AA;--toast:#F2EFE8;--toast-ink:#1B1A18;--veil:rgba(20,19,17,.55);--sheet:#2A2924;
  --c-proj:#3F5F95;--c-dev:#2F6E5C;--c-apps:#8A5A33;--c-appdata:#7F6C2C;--c-media:#8A4A4A;--c-caches:#55702F;--c-dl:#2D6878;--c-sys:#4A4741;--c-other:#34322E;--c-ink:#F2EFE8}
.wall-A{background:linear-gradient(112deg,transparent 28%,rgba(255,243,206,.75) 42%,rgba(255,243,206,.2) 52%,transparent 62%),linear-gradient(168deg,#E8E0CF 0%,#D7DEDA 55%,#C9D6DA 100%)}
body.dark .wall-A{background:linear-gradient(112deg,transparent 28%,rgba(255,214,140,.10) 42%,transparent 60%),linear-gradient(168deg,#2B2823,#1C2427)}
.dA .side{width:228px;padding:52px 10px 10px}
.dA .main{left:244px}
.dA .nav-h{font-size:11px;font-weight:600;color:var(--ink3);padding:12px 10px 5px}
.dA .nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:10px;font-weight:520;color:var(--ink);transition:background-color .15s ease}
.dA .nav .ico{color:var(--ink2)}
.dA .nav[aria-current=true]{background:var(--fill)}
.dA .nav[aria-current=true] .ico{color:var(--ink)}
.dA .nav .badge{margin-left:auto;font-size:11px;color:var(--ink2)}
.dA .side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--fill)}
.dA .side-foot .lbl{font-size:11px;color:var(--ink2);margin-bottom:2px}
.dA .side-foot .big{font-family:var(--f-round);font-size:22px;font-weight:650;letter-spacing:-.01em}
.dA .minibar{height:6px;border-radius:3px;background:var(--hair2);margin-top:8px;overflow:hidden;display:flex}
.dA .minibar i{display:block;height:100%}
.dA .content{padding:6px 28px 28px}
.dA .tb-title{font-weight:650;font-size:15px;margin-left:4px;letter-spacing:-.01em}
.dA .tb-sub{color:var(--ink3);font-size:12px;margin-left:2px}
.dA .spacer{flex:1}
/* A overview */
.dA .ov{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:34px}
.dA .eyebrow{font-size:12px;color:var(--ink2);font-weight:520;margin:6px 0 4px}
.dA .hero{font-family:var(--f-round);font-size:54px;font-weight:700;letter-spacing:-.03em;line-height:1}
.dA .hero small{font-size:20px;font-weight:600;color:var(--ink2);letter-spacing:-.01em;margin-left:6px}
.dA .lede{font-size:15px;line-height:1.5;color:var(--ink2);margin:12px 0 20px;max-width:58ch}
.dA .lede b{color:var(--ink);font-weight:600}
.dA .capbar{height:30px;border-radius:10px;display:flex;overflow:hidden;gap:2px}
.dA .capbar i{display:block;height:100%;transition:filter .15s ease}
.dA .capbar i:hover{filter:brightness(1.06)}
.dA .capbar .free{background:repeating-linear-gradient(135deg,var(--light) 0 6px,color-mix(in oklch,var(--light) 70%,white) 6px 12px);box-shadow:0 0 22px 2px color-mix(in oklch,var(--light) 60%,transparent)}
.dA .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 30px}
.dA .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.dA .legend b{color:var(--ink);font-weight:600}
.dA .sect-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.dA .sect-h h3{font-size:15px;font-weight:650;letter-spacing:-.01em}
.dA .ladder{border-top:1px solid var(--hair)}
.dA .rung{width:100%;text-align:left;display:grid;grid-template-columns:22px minmax(0,1fr) 110px 90px 16px;gap:14px;align-items:center;padding:14px 8px;margin:0 -8px;width:calc(100% + 16px);border-bottom:1px solid var(--hair);border-radius:12px;transition:background-color .15s ease,transform .16s var(--ease-out)}
.dA .rung:hover{background:var(--fill)}
.dA .rung:active{transform:scale(.995)}
.dA .rung .chev{color:var(--ink3)}
.dA .rung .step{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--win)}
.dA .rung h4{font-size:13.5px;font-weight:620;display:flex;gap:8px;align-items:center}
.dA .rung p{color:var(--ink2);font-size:12.5px;line-height:1.45;margin-top:2px}
.dA .rung .sz{font-family:var(--f-round);font-size:22px;font-weight:650;text-align:right;letter-spacing:-.01em}
.dA .rung .after{text-align:right;font-size:11.5px;color:var(--ink2);line-height:1.35}
.dA .rung .after b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.dA .vol{padding:14px;border-radius:16px;background:var(--raise);box-shadow:0 0 0 .5px var(--hair2),0 8px 20px -16px var(--shadow);margin-bottom:10px}
.dA .vol-h{display:flex;gap:10px;align-items:center}
.dA .vol-h .ico{width:22px;height:22px;color:var(--ink2)}
.dA .vol-h b{font-weight:620;display:block}
.dA .vol-h small{color:var(--ink2);font-size:11.5px}
.dA .vol .bar{height:6px;border-radius:3px;background:var(--hair2);margin:12px 0 6px;overflow:hidden}
.dA .vol .bar i{display:block;height:100%;background:var(--ink)}
.dA .vol .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.dA .vol .row b{color:var(--review);font-weight:600}
.dA .vol.dim{background:none;box-shadow:inset 0 0 0 1px var(--hair2)}
.dA .vol .acts{margin-top:12px;display:flex;gap:6px}
.dA .note{font-size:12px;color:var(--ink2);line-height:1.5;padding:4px 2px}
/* A scan */
.dA .scan-top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 0 18px}
.dA .scan-bar{height:12px;border-radius:6px;background:var(--hair2);overflow:hidden;position:relative}
.dA .scan-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in oklch,var(--light) 55%,transparent),var(--light));border-radius:6px;box-shadow:0 0 18px color-mix(in oklch,var(--light) 70%,transparent)}
.dA .counters{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:22px 0 26px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.dA .counters div{padding:14px 0 14px 16px;border-left:1px solid var(--hair)}
.dA .counters div:first-child{border-left:0;padding-left:0}

function worst(row, s) { let sum = 0, mx = 0, mn = Infinity; row.forEach(n => { sum += n.a; mx = Math.max(mx, n.a); mn = Math.min(mn, n.a); }); return Math.max(s * s * mx / (sum * sum), (sum * sum) / (s * s * mn)); }
function squarify(items, x, y, w, h) {
  const out = []; const total = items.reduce((s, i) => s + i.s, 0); if (!total || w <= 0 || h <= 0) return out;
  let nodes = items.filter(i => i.s > 0).map(i => ({ node: i, a: i.s * (w * h) / total })); let r = { x, y, w, h };
  while (nodes.length) {
    const sh = Math.min(r.w, r.h); let row = [nodes[0]], i = 1;
    while (i < nodes.length) { const c = row.concat(nodes[i]); if (worst(c, sh) <= worst(row, sh)) { row = c; i++; } else break; }
    nodes = nodes.slice(row.length); const sum = row.reduce((s, n) => s + n.a, 0);
    if (r.w >= r.h) { const cw = sum / r.h; let cy = r.y; row.forEach(n => { const ch = n.a / cw; out.push({ ...n, x: r.x, y: cy, w: cw, h: ch }); cy += ch; }); r = { x: r.x + cw, y: r.y, w: r.w - cw, h: r.h }; }
    else { const ch = sum / r.w; let cx = r.x; row.forEach(n => { const cw = n.a / ch; out.push({ ...n, x: cx, y: r.y, w: cw, h: ch }); cx += cw; }); r = { x: r.x, y: r.y + ch, w: r.w, h: r.h - ch }; }
  }
  return out;
}
const tipAttr = n => `data-tip="${esc(dispName(n))}|${fmt(n.s)}|${esc(pathOf(n))}"`;
function treemapA(node, W, H) {
  const G = 4; const cells = squarify(node.k, 0, 0, W, H);
  return `<div class="tm" style="width:${W}px;height:${H}px">${cells.map(c => {
    const n = c.node, x = c.x + G / 2, y = c.y + G / 2, w = Math.max(0, c.w - G), h = Math.max(0, c.h - G);
    let inner = '';
    if (n.k.length && w > 90 && h > 70) {
      const sub = squarify(n.k, 6, 42, w - 12, h - 48);
      inner = sub.map(sc => { const sw = sc.w - 3, shh = sc.h - 3; const lab = sw > 70 && shh > 30 ? `<div class="tm-lab" style="font-size:11px;font-weight:560;top:5px;left:7px">${esc(dispName(sc.node))}<small>${fmt(sc.node.s)}</small></div>` : '';
        return `<div class="tm-sub" style="left:${sc.x}px;top:${sc.y}px;width:${sw}px;height:${shh}px;background:${catVar(sc.node.c)}" ${tipAttr(sc.node)}>${lab}</div>`; }).join('');
    }

    return `<div class="tm-cell ${n.r === 'locked' ? 'locked' : ''}" data-act="drill" data-id="${n.id}" ${tipAttr(n)} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${inner ? `color-mix(in srgb, ${catVar(n.c)} 45%, var(--win))` : catVar(n.c)}">${lab}${inner}</div>`;
  }).join('')}</div>`;
}
